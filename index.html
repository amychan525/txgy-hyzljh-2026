<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2026年全年行业助力计划（一期）参与细则</title>
  <link rel="stylesheet" href="style.css?v=0903k">
</head>
<body>
  <!-- 顶部 Header -->
  <header class="header">
    <div class="header-inner">
      <h1 class="header-title">2026年全年行业助力计划</h1>
      <p class="header-subtitle">（一期）参与细则</p>
      <div class="header-meta">
        <span>激励周期 2026.01 — 2026.12</span>
        <span class="meta-sep">|</span>
        <span>更新至 2026 年 9 月</span>
      </div>
    </div>
  </header>

  <!-- 介绍区（背景 / 准入要求 / 如何参与，可折叠） -->
  <section class="intro-sections">
    <div class="section-card">
      <h2 class="section-title" onclick="toggleSection('background-content')">
        <span>背景</span>
        <span class="toggle-icon">▼</span>
      </h2>
      <div class="section-content collapsed" id="background-content"></div>
    </div>

    <div class="section-card">
      <h2 class="section-title" onclick="toggleSection('requirements-content')">
        <span>一、机构和项目的基础准入要求</span>
        <span class="toggle-icon">▼</span>
      </h2>
      <div class="section-content collapsed" id="requirements-content"></div>
    </div>

    <div class="section-card">
      <h2 class="section-title" onclick="toggleSection('howto-content')">
        <span>二、如何参与</span>
        <span class="toggle-icon">▼</span>
      </h2>
      <div class="section-content collapsed" id="howto-content"></div>
    </div>
  </section>

  <!-- 月度激励规则标题 -->
  <div class="rules-heading">
    <h2>三、月度激励规则</h2>
    <p class="rules-subtitle">默认显示当前月（8月）规则，可切换查看历史月份。</p>
    <p class="rules-subtitle rules-subtitle-link">登陆<a href="https://org.gongyi.qq.com/#/sector_grant_2026" target="_blank" rel="noopener">机构服务平台3.0</a>，查看实时激励数据。查看路径：数据中心 → 全年行业资助 → 2026年行业资助。</p>
  </div>

  <!-- 月份选择器（固定在顶部） -->
  <nav class="month-nav" id="month-nav">
    <div class="month-nav-inner">
      <button class="month-btn active" data-month="9">9月 <span class="current-tag">当前</span></button>
      <button class="month-btn" data-month="8">8月</button>
      <button class="month-btn" data-month="7">7月</button>
      <button class="month-btn" data-month="6">6月</button>
      <button class="month-btn" data-month="5">5月</button>
      <button class="month-btn" data-month="4">4月</button>
      <button class="month-btn" data-month="3">3月</button>
      <button class="month-btn" data-month="2">2月</button>
      <button class="month-btn" data-month="1">1月</button>
    </div>
  </nav>

  <!-- 9月助力背景（仅9月显示） -->
  <div class="month-bg" id="month-bg" style="display:none;"></div>

  <!-- 激励点 Tab 导航 -->
  <nav class="point-tabs" id="point-tabs">
    <div class="point-tabs-inner" id="point-tabs-inner"></div>
  </nav>

  <!-- 主内容区域 -->
  <main class="main-content" id="main-content">
    <!-- 动态渲染 -->
  </main>

  <!-- 底部固定信息 -->
  <section class="footer-info">
    <h2 class="footer-heading">四、其他说明</h2>

    <div class="section-card">
      <h2 class="section-title" onclick="toggleSection('appendix-content')">
        <span>附录：好事行为类型清单</span>
        <span class="toggle-icon">▼</span>
      </h2>
      <div class="section-content collapsed" id="appendix-content"></div>
    </div>

    <div class="section-card">
      <h2 class="section-title" onclick="toggleSection('funding-content')">
        <span>资金拨付与平台监督</span>
        <span class="toggle-icon">▼</span>
      </h2>
      <div class="section-content collapsed" id="funding-content"></div>
    </div>

    <div class="section-card">
      <h2 class="section-title" onclick="toggleSection('glossary-content')">
        <span>名词解释</span>
        <span class="toggle-icon">▼</span>
      </h2>
      <div class="section-content collapsed" id="glossary-content"></div>
    </div>
  </section>

  <!-- 页脚 -->
  <footer class="page-footer">
    <p>腾讯公益平台 · 2026年全年行业助力计划</p>
    <p class="footer-small">最后更新：2026年9月1日</p>
  </footer>

  <script src="data.js?v=0903k"></script>
  <script src="app.js?v=0903k"></script>
</body>
</html>
